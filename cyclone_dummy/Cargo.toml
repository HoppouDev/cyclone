[package]
name = "cyclone_dummy"
version = "0.1.0"
edition = "2024"
authors = ["HoppouDev <me@hoppou.dev>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ['http', 'axum'] }
worker-macros = { version = "0.8", features = ['http'] }
axum = { version = "0.8", default-features = false, features = ['json'] }
tower-service = "0.3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[build-dependencies]
typify = "0.7"
schemars = "0.8"
serde_json = "1"
rustfmt-wrapper = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
